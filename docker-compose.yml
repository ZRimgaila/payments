services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Balticamadeus
      POSTGRES_DB: PaymentsDB
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"

  backend:
    build: ./payments-backend
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/PaymentsDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Balticamadeus
    ports:
      - "8081:8081"

  frontend:
    build: ./payments-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
